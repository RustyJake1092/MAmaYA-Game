plugins {
    id "com.android.application"
}

android {
    namespace "com.pixelworld.game"
    compileSdk 35
    ndkVersion "28.1.13356709"

    defaultConfig {
        applicationId "com.pixelworld.game"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DPLATFORM=Android"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("CMakeLists.txt")
            version "3.22.1"
        }
    }
}
